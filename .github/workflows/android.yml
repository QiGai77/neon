name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        working-directory: android
        env:
          NEON_VERSION_CODE: ${{ github.run_number }}
          NEON_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Upload to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk neon-${{ github.ref_name }}-unsigned.apk
          gh release view ${{ github.ref_name }} >/dev/null 2>&1 || gh release create ${{ github.ref_name }} --title "Neon ${{ github.ref_name }}" --notes "Building…"
          gh release upload ${{ github.ref_name }} neon-${{ github.ref_name }}-unsigned.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: neon-apk
          path: android/app/build/outputs/apk/release/*.apk
