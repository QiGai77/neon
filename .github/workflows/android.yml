name: Android release

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Sandbox rootfs with Python
        working-directory: android
        run: bash scripts/build-offline-rootfs.sh
      - name: PRoot binaries
        working-directory: android
        run: python3 scripts/prepare-offline-sandbox.py

      - name: Unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon --tests 'com.qigai.neon.guard.*' --tests 'com.qigai.neon.skills.*' --tests 'com.qigai.neon.hands.*' --tests 'com.qigai.neon.connectors.*' --tests 'com.qigai.neon.sandbox.*'

      - name: Signing key
        env:
          KS: ${{ secrets.NEON_KEYSTORE_B64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/neon-release.jks"

      - name: Build signed APK
        working-directory: android
        env:
          NEON_KEYSTORE_PATH: ${{ runner.temp }}/neon-release.jks
          NEON_KEYSTORE_PASSWORD: ${{ secrets.NEON_KEYSTORE_PASSWORD }}
          NEON_KEY_ALIAS: ${{ secrets.NEON_KEY_ALIAS }}
          NEON_KEY_PASSWORD: ${{ secrets.NEON_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace
          V=$(grep -oP 'NEON_VERSION_NAME"\) \?: "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "neon-v$V.apk"
          echo "APK=android/neon-v$V.apk" >> "$GITHUB_ENV"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1); "$BT/apksigner" verify --print-certs "neon-v$V.apk" | head -5
          unzip -l "neon-v$V.apk" | grep -E 'lib/arm64-v8a/lib(proot|proot-loader|talloc|android-shmem)\.so|assets/neon-mcp-cli/main.py|assets/rootfs-arm64'
          test $(unzip -l "neon-v$V.apk" | grep -cE 'lib/arm64-v8a/lib(proot|proot-loader|talloc|android-shmem)\.so|assets/neon-mcp-cli/main.py') -eq 5

      - uses: actions/upload-artifact@v4
        with:
          name: neon-apk
          path: ${{ env.APK }}
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes ""
          gh release upload "${GITHUB_REF_NAME}" "$APK" --clobber
